<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algostonk Charts — drawing tools</title>
    <style>
      :root {
        --bg: #ffffff; --panel: #f8f9fd; --border: #e0e3eb; --ink: #131722; --muted: #787b86;
        --accent: #2962ff; --accent-soft: #e8efff; --hover: #f0f3fa; --shadow: 0 2px 8px rgba(19,23,34,.10);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); }
      #app { display: grid; grid-template-rows: 44px 1fr; height: 100vh; }

      /* top bar */
      #topbar { display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--bg); }
      #topbar .sym { font-weight: 700; font-size: 15px; letter-spacing: .2px; }
      #topbar .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; }
      #topbar .spacer { flex: 1; }
      #topbar .tbtn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; font-size: 12px; color: var(--ink);
        background: var(--bg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; user-select: none; }
      #topbar .tbtn:hover { background: var(--hover); }
      #topbar .tbtn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

      /* main */
      #main { display: grid; grid-template-columns: 52px 1fr; min-height: 0; }

      /* left toolbar */
      #toolbar { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border-right: 1px solid var(--border); background: var(--panel); overflow-y: auto; }
      #toolbar .tool { position: relative; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 8px;
        cursor: pointer; color: #3c4150; }
      #toolbar .tool:hover { background: var(--hover); color: var(--ink); }
      #toolbar .tool.active { background: var(--accent-soft); color: var(--accent); }
      #toolbar .tool svg { width: 20px; height: 20px; }
      #toolbar .sep { width: 26px; height: 1px; background: var(--border); margin: 5px 0; }
      #toolbar .tool[data-tooltip]:hover::after { content: attr(data-tooltip); position: absolute; left: 46px; top: 50%; transform: translateY(-50%);
        background: var(--ink); color: #fff; font-size: 11px; white-space: nowrap; padding: 4px 8px; border-radius: 5px; box-shadow: var(--shadow); z-index: 50; pointer-events: none; }

      /* chart area */
      #stage { position: relative; min-width: 0; min-height: 0; background: var(--bg); }
      #chart { position: absolute; inset: 0; }
      #overlay { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3; }
      #legend { position: absolute; left: 12px; top: 8px; z-index: 4; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #4a5163; pointer-events: none; }
      #legend .px { color: var(--ink); font-weight: 600; }

      /* style popover */
      #style { position: fixed; z-index: 60; display: none; gap: 8px; align-items: center; padding: 7px 9px; background: #fff;
        border: 1px solid var(--border); border-radius: 9px; box-shadow: var(--shadow); }
      #style.show { display: flex; }
      #style .sw { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--border); }
      #style .sw.sel { box-shadow: 0 0 0 2px var(--accent); }
      #style .w { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; cursor: pointer; font-size: 11px; color: var(--muted); }
      #style .w:hover { background: var(--hover); }
      #style .w.sel { background: var(--accent-soft); color: var(--accent); }
      #style .del { color: #ef5350; cursor: pointer; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 5px; }
      #style .del:hover { background: #fdecec; }
      #style .vr { width: 1px; height: 18px; background: var(--border); }

      /* grouped tool flyout (TradingView-style) */
      #toolbar .tool .caret { position: absolute; right: 2px; bottom: 3px; width: 0; height: 0; border-left: 3.5px solid transparent; border-right: 3.5px solid transparent; border-top: 4px solid #9aa1b0; opacity: .7; }
      #flyout { position: fixed; z-index: 60; min-width: 236px; background: #fff; border: 1px solid var(--border); border-radius: 11px; box-shadow: var(--shadow); padding: 6px; display: none; }
      #flyout.show { display: block; }
      #flyout .grp { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding: 7px 8px 3px; }
      #flyout .item { display: flex; align-items: center; gap: 11px; padding: 7px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--ink); }
      #flyout .item:hover { background: var(--hover); }
      #flyout .item.active { color: var(--accent); background: var(--accent-soft); }
      #flyout .item.soon { color: #b8bdc9; cursor: default; }
      #flyout .item.soon:hover { background: transparent; }
      #flyout .item svg { width: 18px; height: 18px; flex: 0 0 18px; }
      #flyout .item .nm { flex: 1; }
      #flyout .item .sc { font-size: 11px; color: var(--muted); }
      #flyout .item .star { color: #f7b500; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <span class="sym">ALGOSTONK</span><span class="tag">1D · EOD</span>
        <span class="tag" id="hint">Pick a tool, then draw on the chart</span>
        <span class="spacer"></span>
        <div class="tbtn" id="btnMagnet" title="Magnet — snap to OHLC">🧲 Magnet</div>
        <div class="tbtn" id="btnClear" title="Remove all drawings">Clear all</div>
      </div>
      <div id="main">
        <div id="toolbar"></div>
        <div id="stage">
          <div id="chart"></div>
          <canvas id="overlay"></canvas>
          <div id="legend"></div>
          <div id="style"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
